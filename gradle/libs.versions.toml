[versions]
agp = "8.13.2"
kotlin = "1.9.22"
ksp = "1.9.22-1.0.17"

# ── Kotlin 1.9.22 호환 검증 버전 ─────────────────────────────────────────────
# lifecycle 2.9.x / activityCompose 1.10.x 는 Kotlin 2.0+ 전용 → 다운그레이드
coreKtx = "1.13.1"              # 1.16.0은 compileSdk 36 타겟 → 35 안정 버전
lifecycleRuntimeKtx = "2.8.7"   # 2.9.x는 Kotlin 2.0+ 전용
activityCompose = "1.9.3"        # 1.10.x는 lifecycle 2.9.x 쌍
composeBom = "2024.06.00"        # lifecycle 2.8.x 와 호환되는 BOM
# composeOptions.kotlinCompilerExtensionVersion = "1.5.8" (Kotlin 1.9.22 공식 매핑)

junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
roomRuntime = "2.6.1"
tarsosdspAndroid = "2.4"
roomCommonJvm = "2.7.2"
composeLint = "1.4.2"
navigationCompose = "2.7.7"
coroutines = "1.7.3"
coil = "2.6.0"
mlkitFaceDetection = "16.1.7"

[libraries]
# AndroidX Core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }

# Lifecycle
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }

# Activity
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Compose BOM
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Navigation
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Room
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "roomRuntime" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "roomRuntime" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "roomRuntime" }

# Coroutines
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Coil (Image Loading)
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# ML Kit Face Detection
mlkit-face-detection = { group = "com.google.mlkit", name = "face-detection", version.ref = "mlkitFaceDetection" }

# TarsosDSP
tarsosdsp-android = { group = "com.github.JorenSix", name = "TarsosDSP", version.ref = "tarsosdspAndroid" }

# Compose Lint
slack-compose-lint = { group = "com.slack.lint.compose", name = "compose-lint-checks", version.ref = "composeLint" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# kotlin-compose 플러그인은 Kotlin 2.0.0+에서만 존재 — 1.9.22는 composeOptions로 처리
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
